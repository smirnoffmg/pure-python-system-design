site_name: Pure Python System Design
site_description: System design solutions in pure Python using asyncio and Python 3.12+
site_url: https://smirnoffmg.github.io/pure-python-system-design/

repo_url: https://github.com/smirnoffmg/pure-python-system-design
repo_name: pure-python-system-design

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Systems:
    - URL Shortener:
      - url_shortener/index.md
      - Configuration: url_shortener/configuration.md
      - Architecture: url_shortener/architecture.md
      - API Reference: url_shortener/api-reference.md
      - Code Examples: url_shortener/code-examples.md
      - Testing: url_shortener/testing.md
    - Rate Limiter:
      - rate_limiter/index.md
      - Strategies:
        - Token Bucket: rate_limiter/token-bucket.md
        - Fixed Window: rate_limiter/fixed-window.md
        - Leaky Bucket: rate_limiter/leaky-bucket.md
        - Sliding Window Log: rate_limiter/sliding-window-log.md
        - Sliding Window Counter: rate_limiter/sliding-window-counter.md
        - Concurrency Limiter: rate_limiter/concurrency-limiter.md
      - Framework Examples:
        - FastAPI: rate_limiter/examples/fastapi.md
        - Flask: rate_limiter/examples/flask.md
        - Django: rate_limiter/examples/django.md
        - aiohttp: rate_limiter/examples/aiohttp.md
        - Litestar: rate_limiter/examples/litestar.md
        - Sanic: rate_limiter/examples/sanic.md
      - Testing: rate_limiter/testing.md
