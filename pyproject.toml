[project]
name = "pure-python-system-design-docs"
version = "0.1.0"
description = "Documentation for Pure Python System Design"
requires-python = ">=3.12"

[project.optional-dependencies]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[tool.uv]
dev-dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pre-commit>=4.0",
    "commitizen>=4.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
